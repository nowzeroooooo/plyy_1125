name: Deploy Our Wedding

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify deployment configuration
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY in Repository Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
      - run: npm run build
        env:
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEDDING_PROJECT_ID: ${{ vars.VITE_WEDDING_PROJECT_ID }}
      - name: Include GitHub Pages marker
        if: github.event_name != 'pull_request'
        run: touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: wedding-site
          path: dist/
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wedding-site
          path: dist
      - name: Verify static site artifact
        run: |
          test -f dist/index.html || { echo "::error::Build output dist/index.html is missing."; exit 1; }
          test -f dist/.nojekyll || { echo "::error::GitHub Pages marker dist/.nojekyll is missing."; exit 1; }
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
